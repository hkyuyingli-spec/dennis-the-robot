<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4A90B8">
    <meta name="description" content="Nutribot — holistic wellness powered by AI.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nutribot">
    <title>Nutribot</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f1218;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100%;
        height: 100%;
        height: 100dvh;
        padding: 0;
        overflow: hidden;
      }

      .app-frame {
        display: block;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: 0;
      }

      .site-footer {
        flex: 0 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        background: #0f1218;
        color: #aeb8c4;
        font: 13px/1.4 system-ui, sans-serif;
        text-align: center;
      }

      .site-footer a {
        color: #8fc9e8;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      @supports not (height: 100dvh) {
        .app-shell {
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <iframe
        class="app-frame"
        src="https://ainutribot.streamlit.app/?embed=true&amp;show_footer=false"
        title="Nutribot"
        allow="clipboard-write; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <footer class="site-footer">
        <a href="/privacy">Privacy Policy</a>
      </footer>
      <noscript>
        <p class="no-script">
          Nutribot needs JavaScript to load. Open
          <a href="https://ainutribot.streamlit.app/" rel="noopener">the Nutribot web app</a>
          in a browser with JavaScript enabled.
        </p>
      </noscript>
    </main>
    <script>
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((error) => {
            console.error("Nutribot offline shell registration failed:", error);
          });
        });
      }
    </script>
  </body>
</html>
